# Nextcloud Nginx Configuration (FPM Backend)
# Official recommended configuration for Nextcloud 34

upstream nextcloud-fpm {
    server nextcloud:9000;
}



# HTTP redirect to HTTPS (handled by reverse proxy)
server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# HTTPS Server
server {
    listen 80;
    server_name your.domain.com;
    root /var/www/html;

    # Docker internal DNS resolver for dynamic IPs
    resolver 127.0.0.11 valid=30s;

    # Gzip Compression (Best Practice 2026)
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
    gzip_types application/atom+xml application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/wasm application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

    # Fix for missing mjs mime type
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Security Headers
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Logging
    access_log /var/log/nginx/nextcloud_access.log;
    error_log /var/log/nginx/nextcloud_error.log;

    # Client upload size
    client_max_body_size 512G;

    # Collabora Online (CODE) Proxy settings
    location ^~ /browser {
        set $collabora_host collabora;
        proxy_pass http://$collabora_host:9980;
        proxy_set_header Host $http_host;
    }

    location ^~ /hosting {
        set $collabora_host collabora;
        proxy_pass http://$collabora_host:9980;
        proxy_set_header Host $http_host;
    }

    location ^~ /cool {
        set $collabora_host collabora;
        proxy_pass http://$collabora_host:9980;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Nextcloud specific locations
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /.well-known/carddav {
        return 301 https://$host/remote.php/dav;
    }

    location = /.well-known/caldav {
        return 301 https://$host/remote.php/dav;
    }

    location /.well-known/webfinger {
        rewrite ^ /index.php$uri;
    }

    location ^~ /.well-known {
        return 301 https://$host/index.php$request_uri;
    }

    # Static resources with caching
    location ~ ^/(?:index|remote|public|cron|core/ajax/update|status|ocs/v[12]|updater/.+|ocs-provider/.+|oc-[mv])\.php(?:$|/) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;

        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_pass nextcloud-fpm;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;

        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;

        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;

        fastcgi_max_temp_file_size 0;
    }

    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|\.(?:htaccess|git|ht|env)|\w+\.php(?:$|/)) {
        deny all;
        return 404;
    }

    # js/css/woff/woff2/svg/ttf/eot -> static files, don't log
    location ~ \.(?:css|js|mjs|wasm|woff2?|svg|gif|map|png|html|ttf|eot)$ {
        try_files $uri /index.php$request_uri;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to sensitive files
    location ~ \.php(?:$|/) {
        deny all;
    }

    # Rules already covered above
    location ~ ^/(?:updater)(?:$|/) {
        try_files $uri/ =404;
        index index.php;
    }

    # OCS Provider Discovery
    location /ocs-provider/ {
        try_files $uri $uri/ /index.php$request_uri;
        index index.php;
    }

    # Default
    try_files $uri /index.php$request_uri;

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;

        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_pass nextcloud-fpm;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;

        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;

        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;

        fastcgi_max_temp_file_size 0;
    }

    location ~* \.(?:pdf)$ {
        expires 365d;
    }
}
