version: '3.8'

services:
  db:
    image: mariadb:10.6
    container_name: nextcloud-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: '1'
      MARIADB_DISABLE_UPGRADE_BACKUP: '1'
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --max_allowed_packet=1G --innodb_buffer_pool_size=1G --innodb_log_file_size=256M --innodb_log_buffer_size=64M --wait_timeout=28800 --interactive_timeout=28800
    volumes:
      - db:/var/lib/mysql
    networks:
      - nextcloud_net
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    networks:
      - nextcloud_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  nextcloud:
    build: .
    # image: nextcloud:32-fpm
    container_name: nextcloud-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_DOMAIN: ${NEXTCLOUD_DOMAIN}
      OVERWRITEHOST: ${NEXTCLOUD_DOMAIN}
      OVERWRITEPROTOCOL: https
      TRUSTED_PROXIES: 172.17.0.0/12
      PHP_MEMORY_LIMIT: "1024M"
      PHP_UPLOAD_LIMIT: "512G"
      PHP_OPCACHE_MEMORY_CONSUMPTION: "512"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, utility, video, compute]
    volumes:
      - nextcloud:/var/www/html
      - /raid/nextcloud:/var/www/html/data
    networks:
      - nextcloud_net
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  cron:
    build: .
    # image: nextcloud:32-fpm
    container_name: nextcloud-cron
    restart: always
    entrypoint: /cron.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - nextcloud:/var/www/html
      - /raid/nextcloud:/var/www/html/data
    networks:
      - nextcloud_net
    environment:
      PHP_UPLOAD_LIMIT: "512G"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, utility, video, compute]

  collabora:
    image: collabora/code
    container_name: nextcloud-collabora
    restart: always
    environment:
      - domain=your\\.domain\\.com
      - username=admin
      - password=secret
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
    networks:
      - nextcloud_net
    deploy:
      resources:
        limits:
          memory: 2G

  web:
    image: nginx:alpine
    container_name: nextcloud-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - nextcloud
    volumes:
      - nextcloud:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nextcloud_net

volumes:
  db:
  redis:
  nextcloud:

networks:
  nextcloud_net:
    driver: bridge
