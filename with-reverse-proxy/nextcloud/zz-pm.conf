; PHP-FPM worker pool for the Nextcloud container.
; The stock image ships pm.max_children = 5, and its entrypoint does not read
; any PHP_PM_* environment variable, so this file is the only way to change it.
; Sync clients keep most of five workers busy on their own; one large download
; on top of that empties the pool and Nginx answers 504 after 60 seconds.
; Each worker sits around 120 MB RSS, so 32 is about 4 GB at full load.
; Size it to your RAM. The zz- prefix makes it load after the image's zz-docker.conf.
[www]
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500
